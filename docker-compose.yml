services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: football_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_market"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/football_market
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-this-please-32chars}
      JWT_EXPIRES_IN: 15m
      JWT_ALGORITHM: HS256
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm run migration:run && npm run start:dev"

volumes:
  postgres_data:
