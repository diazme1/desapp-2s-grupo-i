services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: football_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_market"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/football_market
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      MARKET_TOKENIZATION_REQUIRE_STATS: ${MARKET_TOKENIZATION_REQUIRE_STATS:-true}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-this-please-32chars}
      JWT_EXPIRES_IN: 2h
      JWT_ALGORITHM: HS256
      CATALOG_REFRESH_API_KEY: ${CATALOG_REFRESH_API_KEY:-}
      FOOTBALL_DATA_API_URL: ${FOOTBALL_DATA_API_URL:-https://api.football-data.org/v4}
      FOOTBALL_DATA_API_TOKEN: ${FOOTBALL_DATA_API_TOKEN:-}
      FOOTBALL_DATA_COMPETITIONS: ${FOOTBALL_DATA_COMPETITIONS:-PL,BL1,PD,SA,FL1}
      FOOTBALL_DATA_MAX_TEAMS: ${FOOTBALL_DATA_MAX_TEAMS:-}
      FOOTBALL_DATA_REQUEST_DELAY_MS: ${FOOTBALL_DATA_REQUEST_DELAY_MS:-6000}
      ML_FASTAPI_BASE_URL: ${ML_FASTAPI_BASE_URL:-http://ml-fastapi:8000}
      ML_FASTAPI_INTERNAL_TOKEN: ${ML_FASTAPI_INTERNAL_TOKEN:-dev-ml-token}
      ML_FASTAPI_TIMEOUT_MS: ${ML_FASTAPI_TIMEOUT_MS:-3000}
      ML_FASTAPI_TRAINING_TIMEOUT_MS: ${ML_FASTAPI_TRAINING_TIMEOUT_MS:-600000}
      ML_MODEL_POLL_INTERVAL_MS: ${ML_MODEL_POLL_INTERVAL_MS:-5000}
      ML_MODEL_PATH: ${ML_MODEL_PATH:-}
      ML_FASTAPI_PORT: ${ML_FASTAPI_PORT:-8000}
      ML_ARTIFACTS_DIR: ${ML_ARTIFACTS_DIR:-/app/artifacts}
      ML_TRAINING_DATA_PATH: ${ML_TRAINING_DATA_PATH:-}
      WHOSCORED_BROWSER_EXECUTABLE_PATH: /usr/bin/chromium
      WHOSCORED_BROWSER_HEADLESS: "true"
      WHOSCORED_BROWSER_TIMEOUT_MS: 45000
      WHOSCORED_NUMBER_OF_PLAYERS: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm run migration:run && npm run start:dev"

  ml-fastapi:
    build:
      context: ./ml-players
    environment:
      ML_FASTAPI_INTERNAL_TOKEN: ${ML_FASTAPI_INTERNAL_TOKEN:-dev-ml-token}
      ML_FASTAPI_TRAINING_TIMEOUT_MS: ${ML_FASTAPI_TRAINING_TIMEOUT_MS:-600000}
      ML_MODEL_POLL_INTERVAL_MS: ${ML_MODEL_POLL_INTERVAL_MS:-5000}
      ML_MODEL_PATH: ${ML_MODEL_PATH:-}
      ML_FASTAPI_PORT: ${ML_FASTAPI_PORT:-8000}
      ML_ARTIFACTS_DIR: ${ML_ARTIFACTS_DIR:-/app/artifacts}
      ML_TRAINING_DATA_PATH: ${ML_TRAINING_DATA_PATH:-}
    ports:
      - "${ML_FASTAPI_PORT:-8000}:${ML_FASTAPI_PORT:-8000}"
    volumes:
      - ./ml-players:/app
      - ml_artifacts:/app/artifacts
    command: sh -c "uvicorn ml_players.inference.main:app --host 0.0.0.0 --port $${ML_FASTAPI_PORT:-8000}"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: /api
      VITE_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  ml_artifacts:
