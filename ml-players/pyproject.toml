[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-players"
version = "0.1.0"
description = "Entrenamiento e inferencia de estadisticas de jugadores"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "joblib>=1.4",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "pyarrow>=17",
  "psycopg[binary]>=3.2"
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

[tool.setuptools.packages.find]
where = ["src"]
