# Completar estos dos valores solamente con los identificadores exactos verificados
# durante el onboarding de SonarQube Cloud. Permanecen sin configurar hasta entonces.
# sonar.organization=<verified-organization>
# sonar.projectKey=<verified-project-key>

sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.spec.ts
sonar.exclusions=dist/**,coverage/**,node_modules/**
sonar.coverage.exclusions=src/main.ts
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/integration/lcov.info
sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
