openapi: 3.0.3
info:
  title: Catálogo de jugadores
  version: 1.0.0
  description: Contrato de consulta del catálogo local de jugadores.
paths:
  /players:
    get:
      summary: Listar jugadores activos
      description: Devuelve jugadores persistidos localmente y permite filtrar por liga, equipo y posición.
      operationId: listarJugadores
      parameters:
        - $ref: '#/components/parameters/LigaFilter'
        - $ref: '#/components/parameters/EquipoFilter'
        - $ref: '#/components/parameters/PosicionFilter'
      responses:
        '200':
          description: Catálogo consultado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaJugadoresResponse'
        '400':
          description: Filtro inválido, vacío o con formato no permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /players/{id}:
    get:
      summary: Consultar el detalle de un jugador
      description: Devuelve un jugador activo identificado por su UUID interno.
      operationId: obtenerJugador
      parameters:
        - $ref: '#/components/parameters/PlayerId'
      responses:
        '200':
          description: Jugador encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JugadorResponse'
        '400':
          description: El identificador no tiene formato UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El jugador no existe o no está activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    LigaFilter:
      name: liga
      in: query
      required: false
      description: UUID interno o código canónico de la liga.
      schema:
        type: string
        maxLength: 100
      example: premier-league
    EquipoFilter:
      name: equipo
      in: query
      required: false
      description: UUID interno o nombre canónico del equipo.
      schema:
        type: string
        maxLength: 100
      example: Arsenal
    PosicionFilter:
      name: posicion
      in: query
      required: false
      description: Código o nombre canónico de la posición.
      schema:
        type: string
        maxLength: 100
      example: delantero
    PlayerId:
      name: id
      in: path
      required: true
      description: UUID interno estable del jugador.
      schema:
        type: string
        format: uuid
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - statusCode
        - message
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          description: Mensaje comprensible en español.
          example: El filtro de posición no es válido.
    LigaResumen:
      type: object
      additionalProperties: false
      required:
        - id
        - codigo
        - nombre
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          example: premier-league
        nombre:
          type: string
          example: Premier League
    EquipoResumen:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: Arsenal
    JugadorPublico:
      type: object
      additionalProperties: false
      required:
        - id
        - nombre
        - posicion
        - equipo
        - liga
        - activo
        - actualizadoEn
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          example: Nombre del jugador
        posicion:
          type: string
          example: delantero
        equipo:
          $ref: '#/components/schemas/EquipoResumen'
        liga:
          $ref: '#/components/schemas/LigaResumen'
        activo:
          type: boolean
          example: true
        actualizadoEn:
          type: string
          format: date-time
          example: '2026-09-20T12:00:00.000Z'
    ListaJugadoresResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JugadorPublico'
        total:
          type: integer
          minimum: 0
          example: 1
    JugadorResponse:
      $ref: '#/components/schemas/JugadorPublico'
